<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliza Decor | ئیلیزا دیکۆر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Noto Kufi Arabic', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #050508; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 25px 15px; position: relative; overflow-x: hidden; }

        /* Galaxy Background */
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(3px 3px at 20px 30px, #ffffff, rgba(0,0,0,0)), radial-gradient(4px 4px at 80px 120px, #e60023, rgba(0,0,0,0)); background-size: 350px 350px; opacity: 0.95; z-index: -2; animation: galaxyTwinkle 12s infinite linear; }
        body::after { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 20%, rgba(230, 0, 35, 0.2) 0%, rgba(5, 5, 8, 0.85) 75%); z-index: -1; }
        @keyframes galaxyTwinkle { 0% { transform: translateY(0); } 100% { transform: translateY(-350px); } }

        .container { width: 100%; max-width: 520px; text-align: center; display: flex; flex-direction: column; align-items: center; z-index: 1; }
        .logo-box { width: 100px; height: 100px; margin-bottom: 12px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, #e60023, #111, #ffffff); box-shadow: 0 0 25px rgba(230, 0, 35, 0.4); animation: pulseGlow 3s infinite ease-in-out; }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 20px rgba(230, 0, 35, 0.4); } 50% { box-shadow: 0 0 35px rgba(230, 0, 35, 0.7); } }
        .logo-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; background-color: #000; }
        
        h1 { font-size: 24px; font-weight: 800; letter-spacing: 1.5px; margin-bottom: 4px; color: #ffffff; }
        h1 span { color: #e60023; }
        .subtitle { font-size: 13px; color: #d1d1d1; margin-bottom: 25px; font-weight: 600; }

        .section-title { width: 100%; text-align: right; font-size: 14px; color: #e60023; font-weight: 700; margin: 10px 0 12px 0; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(230, 0, 35, 0.3); padding-bottom: 6px; }

        /* Showcase Styles */
        .showcase-wrapper { position: relative; width: 100%; display: flex; align-items: center; padding: 0 5px; margin-bottom: 20px; }
        .showcase-scroll-container { width: 100%; display: flex; gap: 14px; overflow-x: auto; padding-bottom: 15px; scroll-behavior: smooth; scroll-snap-type: x mandatory; scrollbar-width: thin; scrollbar-color: rgba(230, 0, 35, 0.6) rgba(255, 255, 255, 0.05); }
        .media-card { min-width: 240px; height: 320px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; overflow: hidden; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5); scroll-snap-align: start; flex-shrink: 0; }
        .media-card img { width: 100%; height: 100%; object-fit: cover; }

        .scroll-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.85); color: #ffffff; border: 1px solid rgba(230, 0, 35, 0.6); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
        .scroll-right { right: -12px; }
        .scroll-left { left: -12px; }

        /* Navigation Button */
        .nav-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(230, 0, 35, 0.4); border-radius: 16px; color: #ffffff; text-decoration: none; font-weight: 600; transition: 0.2s; }
        .nav-btn:hover { background: rgba(230, 0, 35, 0.15); border-color: rgba(230, 0, 35, 0.8); }

        footer { margin-top: 30px; font-size: 12px; color: #888; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box"><img src="logo.png" alt="Logo" class="logo-img"></div>
        <h1>ELIZA <span>DECOR</span></h1>
        <p class="subtitle">کەشخەی ماڵەکەت تەنیا لە Eliza دەبینیت</p>

        <div class="section-title">
            <i class="fa-solid fa-images"></i>
            <span>نموونەی کارەکان بەشی 1 (١ بۆ ٢٧)</span>
        </div>

        <div class="showcase-wrapper">
            <button class="scroll-arrow scroll-right" onclick="scrollGallery(260)"><i class="fa-solid fa-chevron-right"></i></button>
            <div class="showcase-scroll-container" id="galleryContainer">
                <script>
                    for(let i=1; i<=27; i++) {
                        document.write(`<div class="media-card"><img src="${i}.jpg" alt="Work ${i}" loading="lazy"></div>`);
                    }
                </script>
            </div>
            <button class="scroll-arrow scroll-left" onclick="scrollGallery(-260)"><i class="fa-solid fa-chevron-left"></i></button>
        </div>

        <!-- لینکەکە لێرەدا دانراوە -->
        <a href="https://haryad2008khrashid-svg.github.io/ElizaDecore/" class="nav-btn">
            <span>بینینی بەشی ٢ی کارەکان</span>
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <footer>© ELIZA DECOR - All Rights Reserved</footer>
    </div>

    <script>
        function scrollGallery(amount) {
            document.getElementById('galleryContainer').scrollBy({ left: amount, behavior: 'smooth' });
        }
    </script>
</body>
</html>
