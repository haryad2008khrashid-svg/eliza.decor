    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Noto Kufi Arabic', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* Galaxy / Starry Background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(3px 3px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(4px 4px at 80px 120px, #e60023, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 150px 50px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(4px 4px at 220px 200px, #ff4d6d, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 310px 100px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(4px 4px at 380px 280px, #e60023, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 450px 180px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            opacity: 0.95;
            z-index: -2;
            animation: galaxyTwinkle 12s infinite linear;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 20%, rgba(230, 0, 35, 0.2) 0%, rgba(5, 5, 8, 0.85) 75%);
            z-index: -1;
        }

        @keyframes galaxyTwinkle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-350px); }
        }

        /* Shooting Stars */
        .shooting-star {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 2px;
            background: linear-gradient(-45deg, #ffffff, rgba(230, 0, 35, 1), rgba(0, 0, 0, 0));
            border-radius: 999px;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
            animation: tail 3s ease-in-out infinite, shooting 3s ease-in-out infinite;
            z-index: -1;
            opacity: 0;
        }

        .shooting-star:nth-child(1) { top: 10%; left: 80%; animation-delay: 0s; }
        .shooting-star:nth-child(2) { top: 25%; left: 60%; animation-delay: 1.8s; }
        .shooting-star:nth-child(3) { top: 5%; left: 40%; animation-delay: 3.5s; }

        @keyframes tail {
            0% { width: 0; opacity: 0; }
            30% { width: 120px; opacity: 1; }
            100% { width: 0; opacity: 0; }
        }

        @keyframes shooting {
            0% { transform: translateX(0) translateY(0) rotate(-45deg); }
            100% { transform: translateX(-400px) translateY(400px) rotate(-45deg); }
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        /* Logo Area */
        .logo-box {
            position: relative;
            width: 125px;
            height: 125px;
            margin-bottom: 15px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #e60023, #111, #ffffff);
            box-shadow: 0 0 25px rgba(230, 0, 35, 0.4);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(230, 0, 35, 0.4); }
            50% { box-shadow: 0 0 35px rgba(230, 0, 35, 0.7); }
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #000;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            color: #ffffff;
        }

        h1 span {
            color: #e60023;
        }

        p.subtitle {
            font-size: 14px;
            color: #d1d1d1;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* Interactive Links Section */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        box-shadow 0.2s ease, 
                        border-color 0.2s ease, 
                        background 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .link-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(230, 0, 35, 0.6);
            box-shadow: 0 8px 22px rgba(230, 0, 35, 0.35);
            background: rgba(255, 255, 255, 0.09);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon {
            font-size: 22px;
            width: 28px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .link-card:hover .link-icon {
            transform: scale(1.25) rotate(-8deg);
        }

        .link-title {
            font-size: 14.5px;
            font-weight: 600;
        }

        .arrow-icon {
            font-size: 12px;
            color: #777;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-card:hover .arrow-icon {
            transform: translateX(-6px) scale(1.2);
            color: #e60023;
        }

        /* Social Colors */
        .instagram { color: #E1306C; }

        .viber { color: #7360F2; }
        .telegram { color: #0088cc; }

        .call-btn {
            background: linear-gradient(135deg, #e60023, #a00014);
            border: none;
            box-shadow: 0 4px 15px rgba(230, 0, 35, 0.4);
        }

        .call-btn:hover {
            background: linear-gradient(135deg, #ff1a3c, #c4001a);
            box-shadow: 0 8px 25px rgba(230, 0, 35, 0.6);
        }

        .call-btn .arrow-icon {

        }

        /* Footer */

            width: 100%;
            font-size: 12px;
            color: #888;
        }
    </style>
