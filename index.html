<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliza Decor | ئیلیزا دیکۆر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Noto Kufi Arabic', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #050508; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; padding: 25px 15px; position: relative; overflow-x: hidden; }
        
        /* Galaxy Background */
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(3px 3px at 20px 30px, #ffffff, rgba(0,0,0,0)), radial-gradient(4px 4px at 80px 120px, #e60023, rgba(0,0,0,0)); background-size: 350px 350px; opacity: 0.95; z-index: -2; animation: galaxyTwinkle 12s infinite linear; }
        body::after { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 20%, rgba(230, 0, 35, 0.2) 0%, rgba(5, 5, 8, 0.85) 75%); z-index: -1; }
        @keyframes galaxyTwinkle { 0% { transform: translateY(0); } 100% { transform: translateY(-350px); } }

        .container { width: 100%; max-width: 480px; text-align: center; display: flex; flex-direction: column; align-items: center; z-index: 1; }
        .logo-box { width: 125px; height: 125px; margin-bottom: 15px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, #e60023, #111, #ffffff); box-shadow: 0 0 25px rgba(230, 0, 35, 0.4); }
        .logo-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        h1 { font-size: 26px; font-weight: 800; color: #ffffff; margin-bottom: 4px; }
        h1 span { color: #e60023; }
        .subtitle { font-size: 14px; color: #d1d1d1; margin-bottom: 25px; font-weight: 600; }

        .links-container { width: 100%; display: flex; flex-direction: column; gap: 14px; }
        .link-card { display: flex; flex-direction: column; padding: 16px 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; color: #ffffff; text-decoration: none; backdrop-filter: blur(12px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); transition: 0.3s; cursor: pointer; }
        .link-content { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .link-icon { color: #e60023; font-size: 20px; margin-left: 10px; }
        
        /* Gallery Styles */
        .gallery-wrapper { position: relative; margin-top: 15px; width: 100%; display: none; }
        .gallery-container { display: flex; overflow-x: auto; gap: 10px; scroll-behavior: smooth; padding-bottom: 5px; }
        .gallery-container::-webkit-scrollbar { display: none; }
        .gallery-item { flex: 0 0 100px; height: 100px; border-radius: 8px; overflow: hidden; border: 1px solid #e60023; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        
        .scroll-btn { position: absolute; top: 35%; background: rgba(230, 0, 35, 0.9); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; z-index: 10; }
        .prev-btn { right: -5px; }
        .next-btn { left: -5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box"><img src="logo.png" alt="Logo" class="logo-img"></div>
        <h1>ELIZA <span>DECOR</span></h1>
        <p class="subtitle">کەشخەی ماڵەکەت تەنیا لە Eliza دەبینیت</p>

        <div class="links-container">
            <a href="tel:07702681414" class="link-card" style="flex-direction: row; align-items: center; justify-content: space-between;">
                <div style="display:flex; align-items:center"><i class="fa-solid fa-phone link-icon"></i> پەیوەندیی ڕاستەوخۆ</div><i class="fa-solid fa-chevron-left"></i>
            </a>

            <!-- بەشی ١ -->
            <div class="link-card" onclick="document.getElementById('g1').style.display = document.getElementById('g1').style.display === 'block' ? 'none' : 'block'">
                <div class="link-content">
                    <div><i class="fa-solid fa-images link-icon"></i> نموونەی کارەکان بەشی ١</div>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="gallery-wrapper" id="g1">
                    <button class="scroll-btn prev-btn" onclick="event.stopPropagation(); document.getElementById('gal1').scrollBy(200, 0)"><i class="fa-solid fa-chevron-right"></i></button>
                    <div class="gallery-container" id="gal1">
                        <script>
                            for(let i=1; i<=27; i++) { document.write(`<div class="gallery-item"><img src="${i}.jpg"></div>`); }
                        </script>
                    </div>
                    <button class="scroll-btn next-btn" onclick="event.stopPropagation(); document.getElementById('gal1').scrollBy(-200, 0)"><i class="fa-solid fa-chevron-left"></i></button>
                </div>
            </div>

            <!-- بەشی ٢ -->
            <a href="https://haryad2008khrashid-svg.github.io/ElizaDecore/" target="_blank" class="link-card" style="flex-direction: row; align-items: center; justify-content: space-between;">
                <div style="display:flex; align-items:center"><i class="fa-solid fa-images link-icon"></i> نموونەی کارەکان بەشی ٢</div><i class="fa-solid fa-chevron-left"></i>
            </a>
        </div>
        
        <footer style="margin-top:35px; color:#888; font-size:12px;">© ELIZA DECOR - All Rights Reserved</footer>
    </div>

</body>
</html>
