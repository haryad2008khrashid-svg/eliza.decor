<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliza Decor | ئیلیزا دیکۆر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #050508; color: #fff; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; text-align: center; }
        .logo-box { width: 100px; height: 100px; margin: 20px auto; border-radius: 50%; border: 3px solid #e60023; overflow: hidden; }
        .logo-img { width: 100%; height: 100%; object-fit: cover; }
        .links-container { display: flex; flex-direction: column; gap: 12px; }
        
        .link-card { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: #111; border: 1px solid #333; border-radius: 12px; color: #fff; text-decoration: none; transition: 0.3s; }
        .link-card:hover { border-color: #e60023; }
        
        /* Gallery Styles */
        .gallery-box { background: #111; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-top: 10px; }
        .gallery-wrapper { position: relative; display: flex; align-items: center; margin-top: 10px; }
        .gallery-container { display: flex; overflow-x: auto; gap: 10px; scroll-behavior: smooth; padding: 5px; scrollbar-width: none; }
        .gallery-container::-webkit-scrollbar { display: none; }
        .gallery-item { flex: 0 0 100px; height: 100px; border-radius: 8px; overflow: hidden; border: 1px solid #444; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        
        .scroll-btn { position: absolute; background: #e60023; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; z-index: 10; }
        .prev-btn { left: -5px; }
        .next-btn { right: -5px; }
        
        footer { margin-top: 30px; color: #666; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-box"><img src="logo.png" class="logo-img"></div>
    <h1>ELIZA <span style="color:#e60023">DECOR</span></h1>
    
    <div class="links-container">
        <!-- لینکەکان -->
        <a href="tel:07702681414" class="link-card"><span>پەیوەندی ڕاستەوخۆ</span> <i class="fa-solid fa-phone"></i></a>
        <a href="https://wa.me/9647702681414" class="link-card"><span>WhatsApp</span> <i class="fa-brands fa-whatsapp"></i></a>
        <a href="https://www.instagram.com/elizaa_decoor" class="link-card"><span>Instagram</span> <i class="fa-brands fa-instagram"></i></a>
        
        <!-- گەلەری -->
        <div class="gallery-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span style="font-weight:600">نموونەی کارەکانمان</span>
                <i class="fa-solid fa-images" style="color:#e60023"></i>
            </div>
            <div class="gallery-wrapper">
                <button class="scroll-btn prev-btn" onclick="scrollG(-150)"><i class="fa-solid fa-chevron-right"></i></button>
                <div class="gallery-container" id="gal">
                    <script>
                        for(let i=1; i<=27; i++) {
                            document.write(`<div class="gallery-item"><img src="${i}.jpg"></div>`);
                        }
                        function scrollG(val) { document.getElementById('gal').scrollBy({left: val, behavior: 'smooth'}); }
                    </script>
                </div>
                <button class="scroll-btn next-btn" onclick="scrollG(150)"><i class="fa-solid fa-chevron-left"></i></button>
            </div>
        </div>

        <a href="https://haryad2008khrashid-svg.github.io/ElizaDecore/" target="_blank" class="link-card">
            <span>نموونەی کارەکان بەشی 2</span> <i class="fa-solid fa-images"></i>
        </a>
    </div>
    <footer>© ELIZA DECOR - All Rights Reserved</footer>
</div>

</body>
</html>
