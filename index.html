<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموونەی کارەکان بەشی 1 | Eliza Decor</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Kufi Arabic', sans-serif;
        }
        body {
            background-color: #050508;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        h2 {
            margin-bottom: 25px;
            color: #e60023;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .gallery-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .gallery-item:hover {
            transform: scale(1.03);
            border-color: #e60023;
        }
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 25px;
            background: #e60023;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
        .back-btn:hover {
            background: #ff1a3c;
        }
    </style>
</head>
<body>

    <h2>نموونەی کارەکان - بەشی 1</h2>

    <div class="gallery-grid">
        <!-- لێرەدا ٢٧ وێنەکە بە شێوەیەکی ئۆتۆماتیکی و ڕێک ڕیز کراون -->
        <script>
            for (let i = 1; i <= 27; i++) {
                document.write(`
                    <div class="gallery-item">
                        <a href="${i}.jpg" target="_blank">
                            <img src="${i}.jpg" alt="Decor ${i}" loading="lazy">
                        </a>
                    </div>
                `);
            }
        </script>
    </div>

    <a href="index.html" class="back-btn">گەڕانەوە بۆ پەڕەی سەرەکی</a>

</body>
</html>
